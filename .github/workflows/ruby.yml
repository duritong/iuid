---
name: Ruby
on: [push, pull_request]
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.1
      - name: set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - name: install dependencies
        run: bundle install
      - name: run rspec
        run: bundle exec rake spec
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', 'head', 'jruby', 'jruby-head']

  build-and-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', 'head', 'jruby', 'jruby-head']
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.1
      - name: set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: build gem
        run: gem build iuid.gemspec
      - name: install gem
        run: gem install ./iuid-*.gem
      - name: test iuid cli
        run: |
          iuid -V
          iuid --help
